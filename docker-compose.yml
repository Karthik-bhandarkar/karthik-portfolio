services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://portfolio_user:portfolio_password@postgres:5432/portfolio_db
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - PORTFOLIO_ADMIN_TOKEN=${PORTFOLIO_ADMIN_TOKEN:-generate-strong-token-here-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-net

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_DB: portfolio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

volumes:
  postgres_data:
    driver: local

networks:
  portfolio-net:
    driver: bridge
